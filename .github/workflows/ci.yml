name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  GO_VERSION: '1.23'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DB_TLS_MODE: skip-verify

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out
          flags: unittests
        continue-on-error: true

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          args: --timeout=5m

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-w -s" -o contextalarm .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: contextalarm-binary
          path: contextalarm
          retention-days: 7

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Normalize image name
        id: image
        run: |
          echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  update-gitops:
    name: Update GitOps Manifest
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name == 'push'
    concurrency:
      group: gitops-update-${{ github.ref }}
      cancel-in-progress: true
    env:
      GITOPS_REPO: ${{ vars.GITOPS_REPO || 'context-alarm/context-alarm-gitops' }}
      GITOPS_BRANCH: ${{ vars.GITOPS_BRANCH || 'master' }}
      GITOPS_MANIFEST_PATH: ${{ vars.GITOPS_MANIFEST_PATH }}
    steps:
      - name: Normalize image name
        id: image
        run: |
          REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          echo "new_image=ghcr.io/${REPO_LOWER}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Validate GitOps configuration
        run: |
          if [ -z "$GITOPS_REPO" ]; then
            echo "Missing repository variable: GITOPS_REPO (format: owner/repo)"
            exit 1
          fi
          if [ -z "$GITOPS_MANIFEST_PATH" ]; then
            echo "Missing repository variable: GITOPS_MANIFEST_PATH (path to deployment manifest in GitOps repo)"
            exit 1
          fi
          if [ -z "${{ secrets.GITOPS_REPO_TOKEN }}" ]; then
            echo "Missing repository secret: GITOPS_REPO_TOKEN"
            exit 1
          fi

      - name: Clone GitOps repo
        id: gitops_branch
        run: |
          git clone "https://x-access-token:${{ secrets.GITOPS_REPO_TOKEN }}@github.com/${GITOPS_REPO}.git" gitops
          cd gitops

          TARGET_BRANCH="$GITOPS_BRANCH"
          if git show-ref --verify --quiet "refs/remotes/origin/$GITOPS_BRANCH"; then
            echo "Using configured GitOps branch: $GITOPS_BRANCH"
          else
            TARGET_BRANCH=$(git symbolic-ref --short refs/remotes/origin/HEAD | sed 's|^origin/||')
            if [ -z "$TARGET_BRANCH" ]; then
              echo "Unable to resolve GitOps default branch from origin/HEAD"
              exit 1
            fi
            echo "Configured branch '$GITOPS_BRANCH' not found; falling back to default branch '$TARGET_BRANCH'"
          fi

          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          echo "branch=$TARGET_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Update image tag in manifest
        run: |
          cd gitops
          NEW_IMAGE="${{ steps.image.outputs.new_image }}"
          if [ ! -f "$GITOPS_MANIFEST_PATH" ]; then
            echo "Manifest not found: $GITOPS_MANIFEST_PATH"
            exit 1
          fi

          if ! grep -Eq '^\s*image:\s*' "$GITOPS_MANIFEST_PATH"; then
            echo "No image field found in $GITOPS_MANIFEST_PATH"
            exit 1
          fi

          sed -E -i "s|^([[:space:]]*image:[[:space:]]*).*$|\\1${NEW_IMAGE}|" "$GITOPS_MANIFEST_PATH"
          echo "Updated image to: $NEW_IMAGE"

      - name: Commit and push GitOps change
        run: |
          cd gitops
          TARGET_BRANCH="${{ steps.gitops_branch.outputs.branch }}"

          if [ -z "$TARGET_BRANCH" ]; then
            echo "Resolved GitOps target branch is empty"
            exit 1
          fi

          git config user.name "context-alarm-ci"
          git config user.email "context-alarm-ci@users.noreply.github.com"

          if git diff --quiet -- "$GITOPS_MANIFEST_PATH"; then
            echo "No manifest changes detected; skipping commit."
            exit 0
          fi

          git add "$GITOPS_MANIFEST_PATH"
          git commit -m "chore(deploy): update checker image to ${GITHUB_SHA}"
          git push origin "$TARGET_BRANCH"

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Normalize image name
        id: image
        run: |
          echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ github.ref_name }}
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true
